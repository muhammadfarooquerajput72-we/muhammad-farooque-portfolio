name: Import verified portfolio

on:
  push:
    paths:
      - ".github/workflows/import-portfolio.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified archive
        run: |
          curl --fail --silent --show-error --location "https://97a53d7f13fdcb.lhr.life/portfolio.zip" --output portfolio.zip
          echo "1de41debe62717808b315df33da56a4b8933b5605c1a64a712a400e4896ce7fe  portfolio.zip" | sha256sum --check

      - name: Import portfolio source
        run: |
          rm -f .github-bootstrap
          unzip -o portfolio.zip
          rm portfolio.zip
          git config user.name "Muhammad Farooque"
          git config user.email "muhammadfarooquerajput72@gmail.com"
          git add --all
          git commit -m "feat: publish cinematic multidisciplinary portfolio"
          git push origin HEAD:main
